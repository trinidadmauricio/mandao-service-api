  db:
    image: postgres:16-alpine
    container_name: mandao-db
    environment:
      - POSTGRES_USER=mandao_user
      - POSTGRES_PASSWORD=mandao_pass
      - POSTGRES_DB=mandao_db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mandao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandao_user -d mandao_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: mandao-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mandao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  photon:
    image: komoot/photon:latest
    container_name: mandao-photon
    ports:
      - "${PHOTON_PORT:-2322}:2322"
    volumes:
      - photon_data:/photon/photon_data
    restart: unless-stopped
    networks:
      - mandao-network
    environment:
      - PHOTON_LANGUAGE=es,en
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2322/api?q=test"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  photon_data:

networks:
  mandao-network:
    driver: bridge
