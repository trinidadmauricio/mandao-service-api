services:
  # api:

  db:
    image: postgres:16-alpine
    container_name: mandao-db
    environment:
      - POSTGRES_USER=mandao_user
      - POSTGRES_PASSWORD=mandao_pass
      - POSTGRES_DB=mandao_db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mandao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandao_user -d mandao_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: mandao-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mandao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Nominatim - Base de datos para procesar datos OSM
  nominatim:
    image: mediagis/nominatim:4.2
    container_name: mandao-nominatim
    ports:
      - "${NOMINATIM_PORT:-5433}:5432"
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
      - ./photon_data:/nominatim/data
    environment:
      - PBF_URL=file:///nominatim/data/central-america-caribbean-latest.osm.pbf
      - REPLICATION_URL=
      - IMPORT_WIKIPEDIA=false
      - NOMINATIM_PASSWORD=mandao_nominatim_pass
    restart: unless-stopped
    networks:
      - mandao-network
    # Nota: La imagen mediagis/nominatim tiene su propio entrypoint que maneja la inicialización
    # PBF_URL con file:// indica que es un archivo local
    # Nota: El procesamiento inicial puede tomar varias horas

  # Photon Geocoding Service
  # Servicio de geocoding local para Centro América y Caribe
  # Requiere Nominatim con datos procesados
  photon:
    build:
      context: ./docker/photon
      dockerfile: Dockerfile
    container_name: mandao-photon
    ports:
      - "${PHOTON_PORT:-2322}:2322"
    volumes:
      - photon_data:/photon_data
    restart: unless-stopped
    networks:
      - mandao-network
    depends_on:
      - nominatim
    environment:
      - PHOTON_LANGUAGE=es,en
      - NOMINATIM_HOST=nominatim
      - NOMINATIM_PORT=5432
      - NOMINATIM_DB=nominatim
      - NOMINATIM_USER=nominatim
      - NOMINATIM_PASSWORD=mandao_nominatim_pass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2322/api?q=test"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  postgres_data:
  redis_data:
  photon_data:
  nominatim_data:

networks:
  mandao-network:
    driver: bridge
